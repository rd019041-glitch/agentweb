<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northern Trust Service Desk - Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    /* ড্যাশবোর্ডের একদম সেম অফিশিয়াল নর্দান ট্রাস্ট গ্রিন ব্যাকগ্রাউন্ড */
    background-color: #0b3a2e;
    background-image: 
        radial-gradient(circle at 85% 20%, rgba(20, 90, 70, 0.45) 0%, transparent 60%),
        linear-gradient(135deg, #05221a 0%, #0b3a2e 50%, #031812 100%);
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
}

/* সেম ব্যাকগ্রাউন্ড ট্রায়াঙ্গেল শেড */
body::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 65%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 100%);
    clip-path: polygon(100% 0, 0 0, 100% 100%);
    pointer-events: none;
    z-index: 0;
}

/* ব্যাকগ্রাউন্ডে সেম বড়, হালকা ও সাদা রঙের ওয়াটারমার্ক লোগো */
body::after {
    content: "";
    position: absolute;
    right: -5%;
    top: 50%;
    transform: translateY(-50%);
    width: 750px;
    height: 750px;
    background-image: url('bg-logo.svg');
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    filter: brightness(0) invert(1);
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
}

/* TOP HEADER & LOGO CONTAINER */
.top-header {
    position: absolute;
    top: 35px;
    left: 45px;
    z-index: 10;
    display: flex;
    align-items: center;
}

/* টপ-লেফটের ব্রান্ড লোগো (বড় ও স্পষ্ট) */
.brand-logo-img {
    height: 105px; /* ব্র্যান্ডিং স্পষ্ট করার জন্য বড় সাইজ */
    width: auto;
    filter: brightness(0) invert(1);
    transition: transform 0.2s ease;
}

.brand-logo-img:hover {
    transform: scale(1.02);
}

/* AUTHENTICATION BOX CONTAINER */
.auth-container {
    position: relative;
    z-index: 1;
    background: rgba(2, 20, 15, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    margin-top: 40px;
}

.auth-icon {
    width: 64px;
    height: 64px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px auto;
    font-size: 24px;
}

.auth-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #ffffff;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.auth-subtitle {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 32px;
    line-height: 1.5;
    letter-spacing: 0.5px;
}

/* PIN INPUTS */
.pin-inputs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
}

.pin-box {
    width: 48px;
    height: 56px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    color: #ffffff;
    outline: none;
    transition: all 0.25s ease;
    background: rgba(255, 255, 255, 0.05);
}

.pin-box:focus {
    border-color: #ffffff;
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
}

.pin-box.valid {
    border-color: #34d399 !important;
    background: rgba(52, 211, 153, 0.2) !important;
    color: #34d399 !important;
}

.pin-box.invalid {
    border-color: #f87171 !important;
    background: rgba(248, 113, 113, 0.2) !important;
    color: #f87171 !important;
}

.shake {
    animation: shakeAnim 0.4s ease-in-out;
}

@keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
}

.error-message {
    font-size: 13px;
    color: #f87171;
    font-weight: 500;
    min-height: 20px;
    margin-top: -12px;
    margin-bottom: 12px;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.error-message.visible {
    opacity: 1;
}
</style>
</head>
<body>

<header class="top-header">
    <img src="logo.svg" alt="Northern Trust Logo" class="brand-logo-img">
</header>

<div class="auth-container" id="authScreen">
    <div class="auth-icon">🔒</div>
    <h2 class="auth-title">Security Check</h2>
    <p class="auth-subtitle">To access our agent, please enter your 6-digit PIN to authenticate</p>
    
    <div class="pin-inputs" id="pinInputs">
        <input type="password" maxlength="1" class="pin-box" autofocus />
        <input type="password" maxlength="1" class="pin-box" />
        <input type="password" maxlength="1" class="pin-box" />
        <input type="password" maxlength="1" class="pin-box" />
        <input type="password" maxlength="1" class="pin-box" />
        <input type="password" maxlength="1" class="pin-box" />
    </div>

    <div class="error-message" id="errorMessage">Incorrect PIN. Please try again.</div>
</div>

<script>
const HARDCODED_PIN = "712104";
const pinBoxes = document.querySelectorAll('.pin-box');
const pinContainer = document.getElementById('pinInputs');
const errorMessage = document.getElementById('errorMessage');

pinBoxes.forEach((box, index) => {
    box.addEventListener('input', (e) => {
        const val = e.target.value;
        errorMessage.classList.remove('visible');
        pinBoxes.forEach(b => b.classList.remove('invalid'));

        if (val.length === 1 && index < pinBoxes.length - 1) {
            pinBoxes[index + 1].focus();
        }
        checkPin();
    });

    box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && index > 0) {
            pinBoxes[index - 1].focus();
        }
    });
});

function checkPin() {
    let enteredPin = "";
    pinBoxes.forEach(box => enteredPin += box.value);

    if (enteredPin.length === 6) {
        if (enteredPin === HARDCODED_PIN) {
            sessionStorage.setItem('isNorthernTrustAuthenticated', 'true');
            pinBoxes.forEach(box => {
                box.classList.remove('invalid');
                box.classList.add('valid');
            });

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 300);

        } else {
            pinBoxes.forEach(box => box.classList.add('invalid'));
            pinContainer.classList.add('shake');
            errorMessage.classList.add('visible');

            setTimeout(() => {
                pinContainer.classList.remove('shake');
                pinBoxes.forEach(box => {
                    box.value = '';
                    box.classList.remove('invalid');
                });
                pinBoxes[0].focus();
            }, 600);
        }
    }
}
</script>

</body>
</html>
